<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" shape-rendering="crispEdges">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#120d24"/>
      <rect width="2" height="2" fill="#2a2150"/>
    </pattern>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#5b21b6"/>
      <stop offset="1" stop-color="#c026d3"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- pixel stars -->
  <g fill="#f5d0fe">
    <rect x="60" y="40" width="6" height="6"/><rect x="54" y="46" width="6" height="6"/><rect x="66" y="46" width="6" height="6"/><rect x="60" y="52" width="6" height="6"/>
    <rect x="1120" y="290" width="6" height="6"/><rect x="1114" y="296" width="6" height="6"/><rect x="1126" y="296" width="6" height="6"/><rect x="1120" y="302" width="6" height="6"/>
    <rect x="1140" y="50" width="4" height="4"/><rect x="40" y="300" width="4" height="4"/><rect x="980" y="20" width="4" height="4"/><rect x="200" y="330" width="4" height="4"/>
  </g>
  <g fill="#a78bfa">
    <rect x="1080" y="90" width="4" height="4"/><rect x="110" y="250" width="4" height="4"/><rect x="620" y="334" width="4" height="4"/><rect x="760" y="14" width="4" height="4"/>
  </g>

  <!-- window shadow + frame -->
  <rect x="128" y="44" width="944" height="280" fill="#000" opacity=".45"/>
  <rect x="120" y="36" width="944" height="280" fill="#1b1435"/>
  <rect x="120" y="36" width="944" height="280" fill="none" stroke="#a78bfa" stroke-width="4"/>

  <!-- title bar -->
  <rect x="122" y="38" width="940" height="34" fill="url(#title)"/>
  <text x="140" y="61" font-family="'Courier New', Courier, monospace" font-size="17" font-weight="700" fill="#fff">sumi 98 — hello.exe</text>
  <g>
    <rect x="980" y="45" width="20" height="20" fill="#e9d5ff"/><rect x="985" y="58" width="10" height="3" fill="#3b0764"/>
    <rect x="1006" y="45" width="20" height="20" fill="#e9d5ff"/><rect x="1010" y="49" width="12" height="12" fill="none" stroke="#3b0764" stroke-width="2"/>
    <rect x="1032" y="45" width="20" height="20" fill="#e9d5ff"/>
    <path d="M1036 49 L1048 61 M1048 49 L1036 61" stroke="#3b0764" stroke-width="3"/>
  </g>

  <!-- content -->
  <text x="164" y="132" font-family="'Courier New', Courier, monospace" font-size="20" fill="#c4b5fd">&gt; whoami</text>
  <text x="164" y="184" font-family="'Courier New', Courier, monospace" font-size="46" font-weight="700" fill="#ffffff">Mousumi Baidya</text>
  <text x="164" y="222" font-family="'Courier New', Courier, monospace" font-size="21" fill="#f0abfc">Web3 × AI builder · Kolkata, India</text>

  <g font-family="'Courier New', Courier, monospace" font-size="17" fill="#a1a1c4">
    <text x="164" y="270">x / tg ── @hiitssumi</text>
    <text x="164" y="294">linkedin ── mousumibaidya</text>
  </g>
  <rect x="430" y="281" width="12" height="18" fill="#f0abfc">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- pixel heart + badge -->
  <g transform="translate(860 120)" fill="#f472b6">
    <rect x="12" y="0" width="24" height="12"/><rect x="60" y="0" width="24" height="12"/>
    <rect x="0" y="12" width="96" height="24"/>
    <rect x="12" y="36" width="72" height="12"/>
    <rect x="24" y="48" width="48" height="12"/>
    <rect x="36" y="60" width="24" height="12"/>
    <rect x="18" y="16" width="10" height="10" fill="#fce7f3"/>
  </g>
  <g transform="translate(812 236)">
    <rect width="200" height="54" fill="#120d24" stroke="#a78bfa" stroke-width="3"/>
    <text x="100" y="23" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="13" fill="#c4b5fd">3rd · Agora Agents</text>
    <text x="100" y="42" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="13" fill="#c4b5fd">best intern project</text>
  </g>
</svg>
